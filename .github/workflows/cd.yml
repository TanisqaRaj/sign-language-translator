# =============================================================================
# .github/workflows/cd.yml
# Continuous Deployment – Sign Language Translator → Render
#
# Triggers automatically after CI passes on main/master.
# Steps:
#   1. Trigger Render deploy hook (Render pulls the new image from GHCR)
#   2. Poll /_stcore/health until the live app is healthy (or 5-min timeout)
#
# ── Required GitHub Repository Secrets ──────────────────────────────────────
#   RENDER_DEPLOY_HOOK_URL   → copied from Render dashboard (Settings → Deploy Hook)
#   RENDER_APP_URL           → e.g. https://your-app.onrender.com
#
# ── How Render knows which image to pull ─────────────────────────────────────
# Configure your Render service to use the Docker image:
#   ghcr.io/<your-github-username>/sign-lang-translator:latest
# Render will re-pull from GHCR when the deploy hook is triggered.
# The image must be public, or you must add GHCR credentials in Render.
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check secrets are configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ] || [ -z "${{ secrets.RENDER_APP_URL }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ RENDER_DEPLOY_HOOK_URL or RENDER_APP_URL not set — skipping deployment"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render deploy hook
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          echo "Triggering Render deploy hook…"
          RESPONSE=$(curl --silent --show-error --write-out "\n%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Deploy hook returned unexpected status: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Deploy hook triggered successfully"

      - name: Wait for live health check
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          URL="${{ secrets.RENDER_APP_URL }}/_stcore/health"
          echo "Polling $URL (up to 5 minutes)…"
          HEALTHY=false
          for i in $(seq 1 30); do
            HTTP=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "$URL" || echo "000")
            echo "  Attempt $i/30 → HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Live health check failed after 5 minutes"
            echo "Check Render logs at: https://dashboard.render.com"
            exit 1
          fi
          echo "✅ Live app is healthy at ${{ secrets.RENDER_APP_URL }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Deployed and healthy" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: failure()
        run: echo "### ❌ Deploy or health check failed" >> $GITHUB_STEP_SUMMARY
