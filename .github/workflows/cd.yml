# =============================================================================
# .github/workflows/cd.yml
# Continuous Deployment – Sign Language Translator → Render
#
# Triggers automatically after CI passes on main/master.
# Steps:
#   1. Trigger Render deploy hook
#   2. Poll /_stcore/health until the live app is healthy (or timeout)
#
# ── Required GitHub Repository Secrets ──────────────────────────────────────
#   RENDER_DEPLOY_HOOK_URL   → copied from Render dashboard
#   RENDER_APP_URL           → e.g. https://your-app.onrender.com
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Poll the live app's health endpoint until healthy or 5-minute timeout
      - name: Wait for live health check
        run: |
          URL="${{ secrets.RENDER_APP_URL }}/_stcore/health"
          echo "Polling $URL"
          HEALTHY=false
          for i in $(seq 1 30); do
            HTTP=$(curl --silent --output /dev/null --write-out "%{http_code}" "$URL" || echo "000")
            echo "  Attempt $i/30 → HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Live health check failed after 5 minutes"
            exit 1
          fi
          echo "✅ Live app is healthy"

      - name: Deployment summary
        if: success()
        run: echo "### ✅ Deployed and healthy at ${{ secrets.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: failure()
        run: echo "### ❌ Deploy or health check failed" >> $GITHUB_STEP_SUMMARY
