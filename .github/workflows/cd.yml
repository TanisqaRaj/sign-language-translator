# =============================================================================
# .github/workflows/cd.yml
# Continuous Deployment – Sign Language Translator → Render
#
# Triggers automatically after CI passes on main/master.
# Calls Render's deploy hook URL to trigger a re-deploy of the web service.
#
# ── Required GitHub Repository Secret ───────────────────────────────────────
#   RENDER_DEPLOY_HOOK_URL   → copied from Render dashboard (see README)
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Render deploy triggered successfully" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: failure()
        run: |
          echo "### ❌ Render deploy hook failed" >> $GITHUB_STEP_SUMMARY
