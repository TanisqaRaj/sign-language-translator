# =============================================================================
# .github/workflows/ci.yml
# Continuous Integration – Sign Language Translator
#
# Triggers on every push and pull-request to main / master / develop.
# Steps:
#   1. Checkout code
#   2. Set up Python 3.10
#   3. Cache pip packages
#   4. Install cloud dependencies (requirements_cloud.txt)
#   5. Run linting with flake8
#   6. Run unit tests with pytest
#   7. Build Docker image
#   8. Docker health check smoke test (fails job if unhealthy)
#   9. Push image to GHCR (push events to main/master only)
#
# ── Registry ────────────────────────────────────────────────────────────────
# Images are pushed to GitHub Container Registry (GHCR):
#   ghcr.io/<owner>/sign-lang-translator:latest
#   ghcr.io/<owner>/sign-lang-translator:sha-<short>
#
# No extra secrets are needed — GITHUB_TOKEN handles GHCR authentication.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sign-lang-translator

jobs:
  # ── 1. Lint & Test ──────────────────────────────────────────────────────────
  test:
    name: Lint & Test (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_cloud.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (needed for aiortc / av wheel build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavdevice-dev \
            libvpx-dev \
            libopus-dev \
            libsrtp2-dev

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements_cloud.txt flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 . \
            --count \
            --max-line-length=120 \
            --extend-ignore=E501,W503,W504,W291,W293,W391,E221,E231,E272,E402,E127,E128,E201,E203,E302,E303,E305,E401,F401,F541,F811 \
            --exclude=venv,.venv,dataset,logs,docs,models,__pycache__,.git \
            --statistics

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  # ── 2. Build & Push Docker image ────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                 # only runs if tests pass
    permissions:
      contents: read
      packages: write           # required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform (useful if you ever want arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR — uses GITHUB_TOKEN (auto-provided, no secrets needed)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate smart image tags:
      #   latest         → always on main/master
      #   sha-<short>    → every push
      #   branch-<name>  → on feature branches
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr,prefix=pr-

      # Build image on PRs (validate only, don't push)
      - name: Build Docker image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build + push on pushes to main/master/develop
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Smoke test: run the just-built image and verify Docker HEALTHCHECK ──
      # start-period in Dockerfile is 60s — we poll for up to 90s (18 × 5s)
      # to cover cold-start mediapipe + tflite model loading time (~30-40 s).
      - name: Smoke test – Docker health check
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker run -d \
            --name smoke-test \
            -p 8501:8501 \
            -e STREAMLIT_SERVER_HEADLESS=true \
            "$IMAGE"

          # Poll Docker's own HEALTHCHECK status (defined in Dockerfile)
          # First check runs after start-period (60s), then every 30s.
          # We wait up to 150s total (30 polls × 5s) to be safe.
          echo "Waiting for Docker health check to pass (up to 150 s)…"
          HEALTHY=false
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' smoke-test 2>/dev/null || echo "starting")
            echo "  Attempt $i/30 → $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            elif [ "$STATUS" = "unhealthy" ]; then
              echo "Container marked unhealthy — dumping logs:"
              docker logs smoke-test
              docker stop smoke-test && docker rm smoke-test
              exit 1
            fi
            sleep 5
          done

          docker logs smoke-test
          docker stop smoke-test && docker rm smoke-test

          # Fail the CI job if container never became healthy
          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Health check timed out — container did not become healthy"
            exit 1
          fi
          echo "✅ Container is healthy"

      - name: Output image digest
        if: github.event_name == 'push'
        run: echo "Image pushed to ghcr.io/${{ env.IMAGE_NAME }}"
